<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidedoor | All People Powered</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="shortcut icon" href="assets/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=3">
    <style>
        .sidedoor-closed {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-warm-bg);
            padding: 60px 20px;
        }

        .sidedoor-closed-card {
            background: #fff;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        .sidedoor-closed-card img {
            height: 48px;
            width: auto;
            margin-bottom: 24px;
        }

        .sidedoor-closed-card h1 {
            font-family: 'Righteous', cursive;
            font-size: 1.75rem;
            color: var(--color-dark);
            margin-bottom: 12px;
        }

        .sidedoor-closed-card p {
            color: var(--color-gray);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        @media (max-width: 520px) {
            .sidedoor-closed-card {
                padding: 36px 24px;
            }
        }
    </style>
</head>
<body>

    <section class="sidedoor-closed">
        <div class="sidedoor-closed-card">
            <img src="assets/APP-Horizontal-small.png" alt="All People Powered">
            <h1>This entry is now closed</h1>
            <p>Ticket requests are no longer being accepted through this page.</p>
        </div>
    </section>

</body>
</html>
